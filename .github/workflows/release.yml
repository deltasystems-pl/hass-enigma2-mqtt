name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/enigma2_mqtt/manifest.json'))['version'])")
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match manifest version $manifest"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: The changelog must have a section for this version
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

      - name: Extract the release notes
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside && /^\[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Build the HACS zip
        run: |
          cd custom_components/enigma2_mqtt
          zip -r "${GITHUB_WORKSPACE}/enigma2_mqtt.zip" . -x '*.pyc' -x '__pycache__/*'

      - uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }}"
          body_path: release-notes.md
          files: enigma2_mqtt.zip
