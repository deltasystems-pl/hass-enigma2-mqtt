name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Everything a pull request has to pass, in front of the only workflow that publishes.
  # A tag is pushed by a person and a person can push one at any commit, so "main was
  # green" is not evidence about the tagged tree: hassfest, the HACS action, ruff, the
  # test suite and the bundle reproduction all run again here, and the zip is only built
  # if they pass.
  validate:
    name: Validate
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  release:
    name: Build and publish
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/enigma2_mqtt/manifest.json'))['version'])")
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match manifest version $manifest"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: The changelog must have a section for this version
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

      - name: Extract the release notes
        run: |
          # index(...) == 1 is a plain prefix test. A dynamic regex would be read
          # differently by mawk and gawk, and under gawk this silently extracted
          # nothing at all.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside && index($0, "[") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::the release notes for ${VERSION} came out empty"
            exit 1
          fi

      - name: Build the HACS zip
        run: |
          cd custom_components/enigma2_mqtt
          zip -r "${GITHUB_WORKSPACE}/enigma2_mqtt.zip" . -x '*.pyc' -x '__pycache__/*'

      - uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }}"
          body_path: release-notes.md
          files: enigma2_mqtt.zip
