name: Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  pytest:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Report the versions under test
        run: |
          python -c "import homeassistant.const as c; print('homeassistant', c.__version__)"
          pip show pytest-homeassistant-custom-component | head -2
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
