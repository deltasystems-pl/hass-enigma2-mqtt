name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  # Called by the release workflow, so that a tag runs these jobs once - as the gate in
  # front of the published zip - rather than twice beside it.
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: this workflow is a gate in front of a published release, and a
      # moving ref is somebody else's push running in that position.
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93  # master, 2026-09-21

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main, 2026-09-21, after 22.5.0
        with:
          category: integration

  pytest:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Report the versions under test
        run: |
          python -c "import homeassistant.const as c; print('homeassistant', c.__version__)"
          pip show pytest-homeassistant-custom-component | head -2
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q

  plugin-bundle:
    name: Reproduce bundled receiver plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned source commit
        id: bundle
        run: |
          commit=$(python3 -c "import json; print(json.load(open('custom_components/enigma2_mqtt/bundled/metadata.json'))['source_commit'])")
          case "$commit" in
            *[!0-9a-f]*|'') echo "::error::invalid plugin source commit"; exit 1 ;;
          esac
          test "${#commit}" -eq 40
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The whole history, tags included: the bundle builder decides the package's flavour by
      # whether the commit carries its release tag, and a shallow checkout carries none - which
      # would rebuild a release as a development build and fail the comparison below.
      - uses: actions/checkout@v4
        with:
          repository: deltasystems-pl/enigma2-mqtt-bridge
          ref: ${{ steps.bundle.outputs.commit }}
          path: plugin-source
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gettext
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext

      # The builder passes the bundled commit and its flavour to the plugin's build-ipk.sh, so a
      # bundle of a release is byte-identical to the release asset; this rebuild is the test.
      - name: Rebuild and compare every bundled byte
        run: |
          python3 tools/build-plugin-bundle.py --plugin-tree plugin-source --output /tmp/rebuilt
          cmp custom_components/enigma2_mqtt/bundled/metadata.json /tmp/rebuilt/metadata.json
          for file in custom_components/enigma2_mqtt/bundled/*.ipk custom_components/enigma2_mqtt/bundled/*.tar.gz; do
            cmp "$file" "/tmp/rebuilt/$(basename "$file")"
          done

  plugin-shared:
    name: Shared with the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The signed release index's vectors, its embedded keys and the contract's named
      # exceptions are written down in both repositories. Two readers that disagreed would each
      # install what the other refuses, so the copies here are held to the plugin's own, at the
      # commit tests/vectors/SOURCE.json pins.
      - name: Read the pinned plugin commit
        id: pin
        run: |
          commit=$(python3 -c "import json; print(json.load(open('tests/vectors/SOURCE.json'))['commit'])")
          case "$commit" in
            *[!0-9a-f]*|'') echo "::error::invalid pinned plugin commit"; exit 1 ;;
          esac
          test "${#commit}" -eq 40
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: deltasystems-pl/enigma2-mqtt-bridge
          ref: ${{ steps.pin.outputs.commit }}
          path: plugin-source

      - name: Compare the vectors, the keys and the contract
        run: python3 tools/check-plugin-shared.py --plugin-tree plugin-source
