[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["custom_components/enigma2_mqtt/brand"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# so that `custom_components.enigma2_mqtt` imports the same way Home Assistant loads it
pythonpath = ["."]
