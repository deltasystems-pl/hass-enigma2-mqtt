[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["custom_components/enigma2_mqtt/brand"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "tests"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test that awaits something that never comes fails here rather than holding CI for
# hours; every test in this suite finishes in seconds. pytest-timeout comes with the
# Home Assistant test harness.
timeout = 120
testpaths = ["tests"]
# so that `custom_components.enigma2_mqtt` imports the same way Home Assistant loads it
pythonpath = ["."]
