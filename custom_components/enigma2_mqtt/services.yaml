# Every action targets the receiver's media player, which is how a device, an area or
# an entity all resolve to the same box. Names and descriptions live in strings.json.
#
# The target block is repeated rather than written once behind a YAML anchor: hassfest
# reads this file as a map of service names, and an anchor key would be a service that
# does not exist.

zap:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    sref:
      example: "1:0:19:283D:3FB:1:C00000:0:0:0:"
      selector:
        text:
    name:
      example: "TVP 1 HD"
      selector:
        text:

select_bouquet:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    sref:
      required: true
      example: '1:7:1:0:0:0:0:0:0:0:FROM BOUQUET "userbouquet.favourites.tv" ORDER BY bouquet'
      selector:
        text:

send_key:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    key:
      required: true
      example: "KEY_RED"
      selector:
        text:
    long:
      default: false
      selector:
        boolean:

message:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    text:
      required: true
      example: "Pralka skończyła"
      selector:
        text:
          multiline: true
    style:
      default: popup
      selector:
        select:
          translation_key: message_style
          options:
            - popup
            - toast
    type:
      default: info
      selector:
        select:
          translation_key: message_type
          options:
            - info
            - warning
            - error
    timeout:
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
          mode: box

add_timer:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    sref:
      required: true
      example: "1:0:19:283D:3FB:1:C00000:0:0:0:"
      selector:
        text:
    event_id:
      example: 27431
      selector:
        number:
          min: 0
          max: 4294967295
          mode: box
    begin:
      selector:
        datetime:
    end:
      selector:
        datetime:
    name:
      example: "Wiadomości"
      selector:
        text:

delete_timer:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    sref:
      required: true
      example: "1:0:19:283D:3FB:1:C00000:0:0:0:"
      selector:
        text:
    begin:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:

record:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    action:
      required: true
      selector:
        select:
          translation_key: record_action
          options:
            - start
            - stop

screenshot:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player

set_ha_mode:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    mode:
      required: true
      selector:
        select:
          translation_key: ha_mode
          options:
            - "discovery"
            - "integration"
            - "off"

get_epg_grid:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    bouquet:
      example: "Ulubione TV"
      selector:
        text:

stop_stream:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    host:
      required: true
      example: "192.0.2.20"
      selector:
        text:
    sref:
      example: "1:0:19:283D:3FB:1:C00000:0:0:0:"
      selector:
        text:

show_list:
  target:
    entity:
      - integration: enigma2_mqtt
        domain: media_player
  fields:
    title:
      required: true
      example: "Doorbell"
      selector:
        text:
    text:
      example: "Someone is at the gate."
      selector:
        text:
          multiline: true
    rows:
      required: true
      example: '[{"id": "open", "label": "Open the gate", "key": "green", "icon": "gate"}, {"id": "ignore", "label": "Ignore", "key": "red"}]'
      selector:
        object:
          multiple: true
          label_field: label
          description_field: id
          translation_key: list_row
          fields:
            id:
              required: true
              selector:
                text:
            label:
              required: true
              selector:
                text:
            key:
              selector:
                select:
                  translation_key: list_key
                  options:
                    - red
                    - green
                    - yellow
                    - blue
                    - "1"
                    - "2"
                    - "3"
                    - "4"
                    - "5"
                    - "6"
                    - "7"
                    - "8"
                    - "9"
            icon:
              selector:
                select:
                  translation_key: menu_icon
                  options:
                    - neutral
                    - lamp
                    - ceiling-light
                    - blinds
                    - scene
                    - script
                    - power
                    - fan
                    - lock
                    - radiator
                    - thermometer
                    - tv
                    - speaker
                    - door
                    - gate
                    - garage
                    - alarm
                    - camera
                    - sofa
                    - bed
                    - kitchen
                    - garden
                    - movie
                    - note
                    - home
    timeout:
      default: 60
      selector:
        number:
          min: 5
          max: 600
          unit_of_measurement: s
          mode: box
    default:
      example: "ignore"
      selector:
        text:
